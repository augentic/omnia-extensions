# https://doc.rust-lang.org/stable/clippy/index.html

doc-valid-idents = [
  "OpenTelemetry",
  "WebAssembly",
  "WebSocket",
  "WebSockets",
]

# Derived from `cargo tree -d` (host and `--target wasm32-wasip2`) plus
# lockfile-wide version duplicates that clippy's cargo lint sees on every
# platform (windows-*, r-efi, embedded-io).
allowed-duplicate-crates = [
  "base64",
  "block-buffer",
  "core-foundation",
  "cpufeatures",
  "crypto-common",
  "darling",
  "darling_core",
  "darling_macro",
  "digest",
  "embedded-io",
  "foldhash",
  "getrandom",
  "hashbrown",
  "io-lifetimes",
  "prettyplease",
  "r-efi",
  "rand",
  "rand_chacha",
  "rand_core",
  "reqwest",
  "sha2",
  "syn",
  "thiserror",
  "thiserror-impl",
  "untrusted",
  "wasm-encoder",
  "wasm-metadata",
  "wasmparser",
  "wast",
  "windows-sys",
  "windows-targets",
  "windows_aarch64_gnullvm",
  "windows_aarch64_msvc",
  "windows_i686_gnu",
  "windows_i686_gnullvm",
  "windows_i686_msvc",
  "windows_x86_64_gnu",
  "windows_x86_64_gnullvm",
  "windows_x86_64_msvc",
  "wit-bindgen",
  "wit-component",
  "wit-parser",
]
