# Install: `cargo install cargo-make`
# Help: https://sagiegurari.github.io/cargo-make/

extend = [{ path = "examples/Makefile.toml" }]

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[config]
default_to_workspace = true
skip_core_tasks = true
skip_crate_env_info = true
skip_git_env_info = true
skip_rust_env_info = true

# -------------------------------------
# CI Checks
# -------------------------------------
[tasks.check]
dependencies = ["audit", "fmt", "lint", "outdated", "deps"]

[tasks.ci]
dependencies = ["fmt", "lint", "lint-wasm", "test", "test-docs", "docs", "vet", "outdated", "deny"]

# -------------------------------------
# Individual Actions
# -------------------------------------

# Audit
[tasks.audit]
command = "cargo"
args = ["audit"]

# Clean
[tasks.clean]
command = "cargo"
args = ["clean"]

# Deny
[tasks.deny]
command = "cargo"
args = ["deny", "--workspace", "check"]
install_crate = "cargo-deny"

# Deps
[tasks.deps]
script = '''
cargo +nightly udeps --all-targets
'''
install_crate = "cargo-udeps"

# Fmt (fix in place)
[tasks.fmt]
script = "cargo +nightly fmt --all"

# Lint
[tasks.lint]
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]
install_crate = { rustup_component_name = "clippy" }

# Lint the guests for the WASM target. `--all-targets` mirrors `lint` so any
# future wasm32 test or bench is linted rather than silently skipped. Today the
# host-only tests are `#![cfg(not(target_arch = "wasm32"))]` and the runtime
# examples are `cfg_if`-gated to an empty `main`, so they compile to empty
# crates here; the lib crates and the `*-wasm` example guests are what is linted.
[tasks.lint-wasm]
command = "cargo"
args = ["clippy", "--locked", "--workspace", "--all-features", "--all-targets", "--target", "wasm32-wasip2", "--", "-D", "warnings"]
install_crate = { rustup_component_name = "clippy" }

# Miri
[tasks.miri]
script = '''
cargo +nightly miri setup
cargo +nightly miri nextest run --no-tests=pass
'''

# Outdated
[tasks.outdated]
script = '''
cargo outdated --workspace --exit-code 1 --depth 1
'''
install_crate = "cargo-outdated"

# Test
[tasks.test]
command = "cargo"
args = ["nextest", "run", "--locked", "--all", "--all-features", "--no-tests=pass"]
env = { RUSTFLAGS = "-Dwarnings" }

[tasks.docs]
command = "cargo"
args = ["doc", "--no-deps", "--workspace", "--all-features", "--locked"]

# Test Doc
[tasks.test-docs]
command = "cargo"
args = ["test", "--doc", "--all-features", "--workspace"]

# Vet
[tasks.vet]
script = '''
cargo vet regenerate imports
cargo vet regenerate exemptions
cargo vet regenerate unpublished
cargo vet --locked
'''
install_crate = "cargo-vet"

# Dry run of what the `Publish Release` workflow's crates job executes; the
# only pre-release check that every publishable member packages and verifies.
[tasks.publish]
command = "cargo"
args = ["publish", "--workspace", "--locked", "--dry-run"]

# Build the WASM guests
[tasks.wasm]
command = "cargo"
args = ["build", "--locked", "--workspace", "--all-features", "--lib", "--examples", "--target", "wasm32-wasip2", "--release"]
