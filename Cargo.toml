[workspace]
members = ["crates/*", "examples"]
resolver = "3"

[workspace.package]
authors = ["Augentic"]
categories = ["wasm", "web-programming", "asynchronous"]
edition = "2024"
homepage = "https://augentic.io"
keywords = ["extensions", "omnia", "wasi", "wasm", "component-model"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/augentic/omnia-extensions"
rust-version = "1.97"
version = "0.1.0"

[workspace.lints.rust]
# https://dirname.github.io/rust-std-doc/rustc/lints/listing/allowed-by-default.html
missing_docs = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"

[workspace.lints.clippy]
# https://doc.rust-lang.org/stable/clippy/index.html
all = { level = "warn", priority = -1 }      # correctness, suspicious, style, complexity, perf
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Cherry-picked lints are from the `restriction` lint group in order to drive up
# consistency, quality, and brevity
# See https://microsoft.github.io/rust-guidelines/guidelines/universal/index.html

# allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["json"] }
bytes = "1.12.1"
cfg-if = "1.0.5"
chrono = "0.4.45"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = "1.11.1"
hyper-util = "0.1.20"
sea-query = { version = "1.0.2", default-features = false, features = ["thread-safe", "with-chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false }
tracing = "0.1.44"
wasip3 = { version = "0.9.0", features = ["http-compat"] }

# Every `omnia-*` crate stays on the same line and is bumped together. When
# omnia bumps a dependency shared with this workspace (`wasip3`, `hyper`, ...)
# the pin above must follow, or the guests end up with two copies of the crate
# and mismatched `Request`/`Response` types. Never re-add a `[patch.crates-io]`
# git or path override to chase an unreleased change.
omnia = "0.36.0"
omnia-sdk = { version = "0.36.0", default-features = false }
# No default features: each consumer names its rung. A workspace-level
# `guest` feature would unify into the root `[build-dependencies]` line and
# drag `omnia-sdk` into the build-script graph.
omnia-test = { version = "0.36.0", default-features = false }
omnia-wasi-config = "0.36.0"
omnia-wasi-http = "0.36.0"
omnia-wasi-keyvalue = "0.36.0"
omnia-wasi-otel = "0.36.0"
omnia-wasi-sql = "0.36.0"

# internally referenced crates
omnia-http-cache = { path = "crates/http-cache", version = "0.1.0" }
omnia-orm = { path = "crates/orm", version = "0.1.0" }

[profile.release]
lto = true
opt-level = "s"
strip = true
